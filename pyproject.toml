[project]
name = "aibroker"
version = "0.1.1"
description = "Centralized key broker for AI provider API keys"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "cryptography>=43",
    "httpx>=0.27",
    "litellm==1.92.0",
    "redis>=5",
    "structlog>=24.4",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "click>=8.1",
    "tzdata>=2024.1",
    # Downscales images before they reach the self-hosted vision model. Not
    # optional: at native resolution llama.cpp's vision encoder does not fit
    # in memory on the prod host (a probe ran past 600s without completing;
    # the same image at 1024px took 69s).
    "pillow>=11",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aibroker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"
# asr_local (services/asr-local) is a separate deployable package (its own
# pyproject.toml, own Docker image) — not pip-installed alongside aibroker.
# tests/test_asr_local.py mocks the model, so it only needs fastapi/uvicorn
# (already aibroker deps) plus this path to import the package.
pythonpath = ["services/asr-local/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# MUST match the explicit --select/--ignore in .github/workflows/deploy.yml's
# quality job — that CLI override is what actually gates production. Until
# 2026-09-07 the two disagreed in both directions (this file selected S/ASYNC/
# RUF that CI never ran; CI ran W/SIM/C4/RET that this file never selected),
# so an editor or a bare `ruff check` showed a different verdict than deploy.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET"]
ignore = ["E501", "E402", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
