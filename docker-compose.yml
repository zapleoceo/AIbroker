name: aibroker

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aibroker-postgres
    environment:
      POSTGRES_USER: aibroker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: aibroker
    volumes:
      - aibroker_pgdata:/var/lib/postgresql/data
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibroker -d aibroker"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: 3}}

  # Connection pooler between the app and Postgres. Transaction pooling: a
  # server backend is held only for the duration of a transaction, so ~15 real
  # connections serve hundreds of client ones (threshold rationale in
  # docs/deploy-ops.md "Connection scaling"). MAX_PREPARED_STATEMENTS lets
  # asyncpg's protocol-level prepared statements survive transaction pooling
  # (pgbouncer >= 1.21). AUTH_TYPE plain is confined to the compose-internal
  # network (no published ports); pgbouncer still answers Postgres' SCRAM
  # challenge upstream with the same secret. The deep-jobs LISTEN connection
  # bypasses this via DIRECT_DATABASE_URL (NOTIFY needs a pinned backend).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: aibroker-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aibroker:${POSTGRES_PASSWORD}@postgres:5432/aibroker
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "15"
      MIN_POOL_SIZE: "3"
      MAX_PREPARED_STATEMENTS: "500"
      AUTH_TYPE: plain
      LISTEN_PORT: "6432"
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: 3}}

  # Cross-worker selector state (affinity + saturation verdicts) — pure cache
  # semantics: LRU-evicted, never persisted, and the app fails open to its
  # in-process dicts if this container is down. No published ports on purpose.
  redis:
    image: redis:7-alpine
    container_name: aibroker-redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: 3}}

  # Self-hosted faster-whisper — backs the 'local' transcription provider
  # (see providers/litellm_adapter.py, routing/chains.py). Owned by this repo
  # (not vera3's — see docs/deploy-ops.md "Local ASR" for why that mattered):
  # a project boundary must not sit between the broker and a service its own
  # routing depends on. Same resource ceiling that ran healthy under vera3's
  # compose for real prod traffic (2026-07-18): the host has 2 cores shared
  # with Stepan2/Vera, 1 thread avoids thrashing more than it helps.
  # 2026-07-18: tried bumping small -> large-v3-turbo (then medium as a
  # fallback) for accuracy — both OOM-killed loading directly on this host,
  # swap was already 100% full with no headroom for the transient peak
  # during download+int8 quantization. Stayed on small; beam_size=5 (app.py,
  # up from greedy) is the accuracy lever that doesn't cost extra RAM.
  asr-local:
    build:
      context: ./services/asr-local
      dockerfile: Dockerfile
    container_name: aibroker-asr-local
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-1}
      # Drop the model after 10 idle minutes; 0 disables. Real traffic is
      # ~19 transcriptions/day, so it would otherwise hold ~200MB doing
      # nothing on a host that is already 1.3GB into swap. A cold load is
      # 4.4s, against calls that take 15-180s anyway.
      WHISPER_IDLE_UNLOAD_S: ${WHISPER_IDLE_UNLOAD_S:-600}
    cpus: 1.0
    mem_limit: 1500m
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: 3}}

  # Self-hosted vision — llama.cpp serving Qwen3-VL-4B-Instruct Q4_K_M on CPU.
  # Backs the 'local' vision provider (providers/litellm_adapter.py,
  # routing/chains.py, where it leads the chain). Added 2026-08-31 because
  # vision was running an 8% success rate: 1762 ok against ~20000 CapBlock and
  # RateLimit errors over 14 days, all of it one client's traffic.
  #
  # Upstream image, NOT a local build, and the model is MOUNTED rather than
  # baked: deploys build on the production host inside a 10-minute CI step
  # (see /usr/local/bin/aibroker-deploy), and pulling 3.3GB of weights into an
  # image layer on every Dockerfile touch would put that budget at risk for no
  # gain. One-time host setup is in docs/deploy-ops.md "Local vision".
  #
  # Numbers measured on this host 2026-08-31 (see docs/deploy-ops.md):
  #   69s   chat screenshot, model resident
  #   192s  dense document (the slow end)
  #   5105MB peak RSS -> mem_limit 5600m. It plateaus there because most of it
  #          is page cache for the mmap'd weights, which the kernel reclaims
  #          under pressure; a 3800m cap made it thrash and blow past 600s.
  # threads 3 of 4 cores, cpus 2.5: the box also runs Vera/Stepan2/postgres.
  # --parallel 1 serializes decodes — a second slot would buy a second KV
  # cache (~1.1GB) we do not have the RAM for.
  #
  # 2026-09-02, after 7 host-wide OOM kills in 24h (llama-server was the victim
  # every time, at 4.4-5.5GB anon-rss; the cgroup cap never fired — the HOST ran
  # out). Two changes, both measured:
  #
  # -c 8192 -> 6144. KV cache is 144KiB/token here (36 layers x 8 KV heads x
  # 128 head_dim, f16), so this returns ~288MB. 6144 and not 4096: over 183 real
  # calls tokens_in was p50=851, p90=979, p99=1235, MAX=4451, and tokens_out
  # peaked at 341 — so 4096 would truncate the largest real document we have
  # actually served, while 6144 clears it with ~21% headroom.
  #
  # --sleep-idle-seconds 900 -> 120. Real gaps between bursts are 28-37 min,
  # i.e. always longer than 900s, so the model was already sleeping before
  # nearly every burst — the 900 bought almost no avoided reloads (measured: 16
  # sleeps against 8 reloads in one window, a wake costs ~16s) while holding
  # ~5GB through idle windows on a host with ~1.4GB free. 120s frees that for
  # roughly 13 extra minutes per gap. Intra-burst images arrive seconds apart
  # and still find the model awake.
  #
  # NOT adopted: --no-repack. It would keep the weights as reclaimable
  # file-backed mmap instead of ~3.3GB of anonymous private-dirty copies (the
  # repacked AVX layouts are why anon-rss dwarfs file-rss), which is the most
  # direct fix for the OOM mechanism — but measured on the same image it ran
  # 310s against 203s, +53%. Against the 300s call timeout that would abort
  # nearly every request. Repacking is bought with memory and sold as speed,
  # and we cannot pay in speed at 130s average.
  vision-local:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: aibroker-vision-local
    command: >
      -m /models/qwen3-vl-4b-Q4_K_M.gguf
      --mmproj /models/qwen3-vl-4b-mmproj-F16.gguf
      -c ${VISION_CTX:-6144} --threads 3 --parallel 1
      --sleep-idle-seconds ${VISION_IDLE_UNLOAD_S:-120}
      --host 0.0.0.0 --port 8080
    volumes:
      - ${VISION_MODEL_DIR:-/var/lib/aibroker-vision/model}:/models:ro
    cpus: 2.5
    mem_limit: 5600m
    expose:
      - "8080"
    # /health is exempt from llama-server's idle timer, so polling it can
    # neither keep the model awake nor trigger a reload.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: 3}}

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aibroker-api
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      asr-local:
        condition: service_started
      vision-local:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://aibroker:${POSTGRES_PASSWORD}@pgbouncer:6432/aibroker
      DIRECT_DATABASE_URL: postgresql+asyncpg://aibroker:${POSTGRES_PASSWORD}@postgres:5432/aibroker
      REDIS_URL: redis://redis:6379/0
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET must be set}
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY must be set}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET must be set}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-0}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GLOBAL_DAILY_CAP_USD: ${GLOBAL_DAILY_CAP_USD:-20.0}
      PUBLIC_HOST: ${PUBLIC_HOST:-aib.zapleo.com}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Same compose network now (asr-local above) — no more cross-project
      # network join. Empty/unreachable degrades safely to groq/gemini/openai.
      ASR_LOCAL_URL: ${ASR_LOCAL_URL:-http://aibroker-asr-local:8000}
      # Empty/unreachable degrades safely to gemini/openrouter/openai.
      VISION_LOCAL_URL: ${VISION_LOCAL_URL:-http://aibroker-vision-local:8080}
    ports:
      - "127.0.0.1:8004:8000"
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: 3}}

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aibroker-monitor
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      pgbouncer:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://aibroker:${POSTGRES_PASSWORD}@pgbouncer:6432/aibroker
      DIRECT_DATABASE_URL: postgresql+asyncpg://aibroker:${POSTGRES_PASSWORD}@postgres:5432/aibroker
      REDIS_URL: redis://redis:6379/0
      TOKEN_SECRET: ${TOKEN_SECRET}
      ADMIN_KEY: ${ADMIN_KEY}            # not used by monitor, but Settings requires it
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONITOR_INTERVAL_S: "600"
    command: ["python", "-m", "aibroker.monitor"]
    # No HTTP server here — the Dockerfile HEALTHCHECK curls :8000, which this
    # worker never binds, so it would report a permanently-false "unhealthy".
    healthcheck:
      disable: true
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: 3}}

volumes:
  aibroker_pgdata:
    driver: local
