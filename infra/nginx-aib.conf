# /etc/nginx/sites-enabled/aib
# Cloudflare proxies aib.zapleo.com → us on :80 (CF mode Flexible).
# All TLS is between client and Cloudflare; CF↔origin is plaintext HTTP.

# Per-project rate limit (2026-09-07 review: there was none anywhere, while the
# stepan2 vhost on this same host has had one for months). Keyed by the raw
# X-Project-Key header, so each project gets its own bucket and a leaked or
# runaway key cannot hammer the DB, the job queue, or the 1-3-thread local
# vision/ASR containers past this rate — the daily $ caps never protected any
# of that (free keys cost $0). Sized against real traffic: the busiest project
# does ~3 req/min on average but job POLLING bursts to ~5 req/s (24 concurrent
# jobs polled every ~5s), so 600r/m sustained with a 200-request burst leaves
# normal clients untouched and only trips on a genuine flood. An EMPTY key
# (dashboard cookie sessions, /healthz, Cloudflare probes) is not limited —
# nginx skips limiting when the zone key is empty; those paths have their own
# protection (owner-only sessions, IP restriction).
limit_req_zone $http_x_project_key zone=aib_project:10m rate=600r/m;

server {
    listen 80;
    server_name aib.zapleo.com;

    # Trust CF's client IP forwarding
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 4m;

    location / {
        limit_req zone=aib_project burst=200 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
