<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · AIbroker</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="stylesheet" href="{{ asset('css/tokens.css') }}">
<link rel="stylesheet" href="{{ asset('css/app.css') }}">
<style>
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-box { width: min(420px, 100%); padding: 40px 28px 32px; text-align: center; display: grid; gap: 14px; justify-items: center; position: relative; }
  .login-box h1 { font-size: 26px; }
  .login-box .mark { width: 44px; height: 44px; border-radius: 13px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
  .login-box .mark svg { width: 22px; height: 22px; }
  .login-lang { position: absolute; top: 12px; right: 12px; }
  .widget { min-height: 48px; display: grid; place-items: center; margin-top: 6px; }
</style>
</head>
<body data-reload-on-tz="off">
<main class="login">
  <div class="card login-box">
    <div class="seg lang login-lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span>
    <h1>AIbroker</h1>
    <p class="muted">{{ t("Sign in with Telegram to administer", "Войти через Telegram, чтобы администрировать") }}</p>
    <div class="widget">
      <script async src="https://telegram.org/js/telegram-widget.js?22"
              data-telegram-login="{{ bot }}"
              data-size="large"
              data-radius="8"
              data-auth-url="https://{{ host }}/api/tg_login"
              data-request-access="write"></script>
    </div>
    {% if error %}<div class="flash err" role="alert" style="width:100%">{{ error }}</div>{% endif %}
  </div>
</main>
<script>
(function () {
  var KEY = "aib_lang", q = new URLSearchParams(location.search).get("lang"), lang = "en";
  try { var s = localStorage.getItem(KEY); if (s === "ru" || s === "en") lang = s; } catch (e) {}
  if (q === "ru" || q === "en") lang = q;
  function apply(l) {
    document.documentElement.lang = l;
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var t = el.getAttribute("data-" + l); if (t !== null) el.textContent = t;
    });
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.lang === l ? "true" : "false");
    });
    try { localStorage.setItem(KEY, l); } catch (e) {}
  }
  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () { apply(b.dataset.lang); });
  });
  apply(lang);
})();
</script>
</body>
</html>
